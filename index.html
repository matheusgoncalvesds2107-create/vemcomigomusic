<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>V.C Music</title>
<style>

:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#132640;--text:#ffffff;--muted:#aeb8c8;--accent:#d8a928;--accent2:#f3cf62;--line:#20344f}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 8% 10%,rgba(56,132,255,.34),transparent 22%),radial-gradient(circle at 92% 14%,rgba(184,86,255,.28),transparent 24%),radial-gradient(circle at 78% 82%,rgba(216,169,40,.24),transparent 26%),radial-gradient(circle at 25% 78%,rgba(0,214,255,.18),transparent 24%),linear-gradient(180deg,#07111f,#0a1727 58%,#091320);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;padding-bottom:132px}.sidebar{position:sticky;top:0;height:calc(100vh - 102px);background:#081321;border-right:1px solid var(--line);padding:24px 16px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}.brandmark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--accent2),#b8860b);color:#081321;display:grid;place-items:center;font-weight:950}.brand small,.muted{display:block;color:var(--muted);font-size:12px;margin-top:3px}
nav{display:grid;gap:7px}.nav,.plain,.mnav{border:0;background:transparent;color:var(--muted)}.nav{display:flex;gap:13px;align-items:center;width:100%;padding:13px 14px;border-radius:12px;text-align:left;font-weight:700}.nav:hover,.nav.active{background:var(--panel2);color:#fff}
.playlist-box{border-top:1px solid var(--line);margin-top:24px;padding-top:20px}.playlist-title{font-size:11px;letter-spacing:.14em;color:#7f8590;margin-bottom:10px}.plain{padding:8px 0;color:#d7d9dd}
.topbar{height:76px;display:flex;align-items:center;justify-content:flex-end;padding:0 28px;position:sticky;top:0;background:rgba(8,19,33,.78);backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 0 30px rgba(85,119,255,.10)}.mobile-brand{display:none;align-items:center;gap:9px;margin-right:auto}.brandmark.small{width:34px;height:34px;border-radius:10px;font-size:13px}
.pill,.cta{border:0;border-radius:999px;font-weight:850}.pill{background:#fff;color:#0a1422;padding:10px 17px}.cta{background:var(--accent);color:#081321;padding:12px 20px}
.page{display:none;padding:28px;max-width:1280px;margin:auto}.page.active{display:block}.hero{min-height:330px;border-radius:24px;padding:42px;display:grid;grid-template-columns:1.3fr .7fr;align-items:center;background:radial-gradient(circle at 12% 18%,rgba(56,132,255,.36),transparent 25%),radial-gradient(circle at 88% 20%,rgba(184,86,255,.26),transparent 24%),radial-gradient(circle at 72% 78%,rgba(216,169,40,.28),transparent 28%),linear-gradient(135deg,#10233a,#081321);border:1px solid #27405e;box-shadow:0 0 50px rgba(56,132,255,.14),0 0 70px rgba(184,86,255,.10)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.15em;color:var(--accent)}.hero h1{font-size:clamp(40px,6vw,74px);letter-spacing:-.06em;line-height:.94;margin:12px 0 18px}.hero p{color:var(--muted);max-width:620px;font-size:16px}.hero-disc{display:grid;place-items:center}.disc-ring{width:220px;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#14263e 0 5px,#081321 5px 10px);display:grid;place-items:center}.disc-core{width:72px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#062012;font-weight:1000}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px}.section-head h2{margin:0;font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(13,27,45,.92),rgba(10,20,35,.92));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}.card:hover{box-shadow:0 12px 28px rgba(56,132,255,.10),0 0 25px rgba(216,169,40,.10)}.cover{aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,#1a3150,#0a1727);display:grid;place-items:center;font-size:44px;margin-bottom:12px}.card strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card span{font-size:13px;color:var(--muted)}
.search{width:100%;max-width:650px;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:#102139;color:#fff;outline:none;margin-bottom:20px}.track-list{display:grid;gap:8px}.track{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 10px;border-radius:12px}.track:hover{background:#102139}.track-cover{width:48px;height:48px;border:0;border-radius:8px;background:#162a44;color:#fff;display:grid;place-items:center}.track-info{min-width:0}.track-info strong,.track-info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-info span{color:var(--muted);font-size:12px;margin-top:3px}.icon-btn{border:0;background:transparent;color:#dadddf;font-size:18px}.icon-btn.on{color:var(--accent)}
.player{position:fixed;left:0;right:0;bottom:0;height:102px;background:linear-gradient(180deg,rgba(10,23,39,.96),rgba(8,19,33,.98));border-top:1px solid var(--line);z-index:20;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;padding:12px 18px;gap:18px;box-shadow:0 -10px 35px rgba(56,132,255,.14),0 -3px 20px rgba(184,86,255,.10)}.now{display:flex;align-items:center;gap:11px;min-width:0}.cover-mini{width:58px;height:58px;border-radius:10px;background:#162a44;display:grid;place-items:center;font-size:22px}.now-text{min-width:0}.now-text strong,.now-text span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-text span{font-size:12px;color:var(--muted);margin-top:4px}.buttons{display:flex;align-items:center;justify-content:center;gap:14px}.play-btn{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#0a1422;font-weight:900}.timeline{display:grid;grid-template-columns:38px 1fr 38px;gap:8px;align-items:center;margin-top:7px;color:var(--muted);font-size:11px}input[type=range]{accent-color:var(--accent);width:100%}.volume{display:flex;justify-content:flex-end;align-items:center;gap:8px}.volume input{max-width:130px}.mobile-nav{display:none}.empty{color:var(--muted);padding:28px 0}
@media(max-width:800px){.app{display:block;padding-bottom:156px}.sidebar{display:none}.topbar{height:64px;padding:0 14px}.mobile-brand{display:flex}.pill{font-size:12px;padding:9px 12px}.page{padding:16px}.hero{grid-template-columns:1fr;padding:24px;min-height:260px}.hero-disc{display:none}.hero h1{font-size:46px}.player{bottom:62px;height:86px;grid-template-columns:1fr auto;padding:9px 12px}.controls{grid-column:2;grid-row:1}.buttons #shuffleBtn,.buttons #prevBtn,.buttons #nextBtn,.buttons #repeatBtn,.timeline,.volume{display:none}.cover-mini{width:52px;height:52px}.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;height:62px;background:#081321;border-top:1px solid var(--line);z-index:30}.mnav{display:grid;place-items:center;padding:7px 2px;font-size:19px}.mnav span{font-size:10px}.mnav.active{color:var(--accent)}}

.brandmark,.cta,.play-btn{
  box-shadow:0 0 18px rgba(216,169,40,.16),0 0 28px rgba(70,120,255,.08);
}
.nav.active,.mnav.active{
  box-shadow:inset 0 0 0 1px rgba(216,169,40,.24),0 0 16px rgba(56,132,255,.14);
}

/* V.C Music 0.2.2 — luzes reforçadas */
.hero{
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;
  inset:-25%;
  pointer-events:none;
  background:
    radial-gradient(circle at 22% 28%,rgba(54,126,255,.16),transparent 18%),
    radial-gradient(circle at 82% 22%,rgba(194,82,255,.13),transparent 17%),
    radial-gradient(circle at 70% 78%,rgba(243,207,98,.12),transparent 20%);
  filter:blur(10px);
}
.hero > *{position:relative;z-index:1}

.card{
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover{
  transform:translateY(-3px);
  border-color:rgba(243,207,98,.28);
  box-shadow:
    0 14px 34px rgba(0,0,0,.22),
    0 0 26px rgba(56,132,255,.14),
    0 0 22px rgba(184,86,255,.08),
    0 0 16px rgba(216,169,40,.09);
}
.player{
  box-shadow:
    0 -12px 42px rgba(56,132,255,.14),
    0 -6px 28px rgba(184,86,255,.10),
    0 -2px 18px rgba(216,169,40,.08);
}
.brandmark{
  box-shadow:
    0 0 18px rgba(216,169,40,.24),
    0 0 30px rgba(56,132,255,.12);
}
.play-btn{
  box-shadow:
    0 0 20px rgba(255,255,255,.12),
    0 0 30px rgba(216,169,40,.12);
}

.player-visualizer{
  grid-column:1 / 4;
  grid-row:2;
  height:42px;
  display:flex;
  align-items:flex-end;
  gap:6px;
  padding:0 6px 0 2px;
  overflow:hidden;
}
.player-visualizer span{
  flex:1 1 auto;
  min-width:8px;
  height:10px;
  border-radius:6px 6px 2px 2px;
  opacity:.92;
  background:linear-gradient(180deg,#8befff,#5dd8ff 36%,#f3cf62 68%,#ffb357 100%);
  box-shadow:0 0 10px rgba(93,216,255,.16),0 0 12px rgba(243,207,98,.10);
}
.player-visualizer span:nth-child(4n){background:linear-gradient(180deg,#7de7ff,#4ab7ff 34%,#f3cf62 68%,#ffc06e 100%)}
.player-visualizer span:nth-child(5n){background:linear-gradient(180deg,#c090ff,#8b7cff 30%,#ffb5b5 58%,#ffc374 100%)}
.player-visualizer span:nth-child(3n){background:linear-gradient(180deg,#7affd8,#4be9ff 34%,#f3cf62 68%,#ffbe77 100%)}

.player-visualizer.active span{
  animation:vcEq 900ms ease-in-out infinite alternate;
}
.player-visualizer.active span:nth-child(2){animation-delay:.08s}
.player-visualizer.active span:nth-child(3){animation-delay:.16s}
.player-visualizer.active span:nth-child(4){animation-delay:.24s}
.player-visualizer.active span:nth-child(5){animation-delay:.1s}
.player-visualizer.active span:nth-child(6){animation-delay:.18s}
.player-visualizer.active span:nth-child(7){animation-delay:.26s}
.player-visualizer.active span:nth-child(8){animation-delay:.34s}
.player-visualizer.active span:nth-child(9){animation-delay:.12s}
.player-visualizer.active span:nth-child(10){animation-delay:.2s}
.player-visualizer.active span:nth-child(11){animation-delay:.28s}
.player-visualizer.active span:nth-child(12){animation-delay:.36s}
.player-visualizer.active span:nth-child(13){animation-delay:.14s}
.player-visualizer.active span:nth-child(14){animation-delay:.22s}
.player-visualizer.active span:nth-child(15){animation-delay:.3s}
.player-visualizer.active span:nth-child(16){animation-delay:.38s}
.player-visualizer.active span:nth-child(17){animation-delay:.16s}
.player-visualizer.active span:nth-child(18){animation-delay:.24s}
.player-visualizer.active span:nth-child(19){animation-delay:.32s}
.player-visualizer.active span:nth-child(20){animation-delay:.4s}
.player-visualizer.active span:nth-child(21){animation-delay:.18s}
.player-visualizer.active span:nth-child(22){animation-delay:.26s}
.player-visualizer.active span:nth-child(23){animation-delay:.34s}
.player-visualizer.active span:nth-child(24){animation-delay:.42s}

@keyframes vcEq{
  0%{height:8px;opacity:.65}
  20%{height:18px}
  45%{height:30px}
  70%{height:16px}
  100%{height:40px;opacity:1}
}

@media(max-width:800px){
  .player-visualizer{
    grid-column:1 / 3;
    grid-row:2;
    height:28px;
    gap:4px;
    padding:0 2px;
  }
  .player-visualizer span{
    min-width:5px;
  }
}

/* ===== V.C MUSIC 0.2.4 - MOBILE FINAL ===== */
.mobile-now-strip{display:none}

@media(max-width:800px){

    min-height:100%;

  body{overflow-x:hidden}

  .app{

  .sidebar{display:none}

    box-shadow:0 8px 28px rgba(0,0,0,.18);
  }

  .mobile-brand{
    display:flex;

  }

  .mobile-brand strong{

  }

  .brandmark.small{

    height:36px;
    border-radius:11px;

      0 0 16px rgba(216,169,40,.22),
      0 0 22px rgba(56,132,255,.12);
  }

  .pill{
    font-size:11px;
    padding:9px 11px;
    border-radius:999px;
    box-shadow:0 0 16px rgba(255,255,255,.05);
  }

  .page{
    padding:12px 12px 18px;
  }

  .hero{
    min-height:220px;

      radial-gradient(circle at 88% 18%,rgba(184,86,255,.22),transparent 24%),
      radial-gradient(circle at 72% 82%,rgba(216,169,40,.20),transparent 30%),

  }

  .hero h1{

    line-height:.95;
    margin:10px 0 12px;
    max-width:280px;
  }

  .hero p{

    line-height:1.45;

  }

  .hero-disc{

  }

  .cta{

  }

  .section-head{

  .card{

  .cover{

    font-size:36px;

  .card strong{

  }

  .card span{

  }

  .search{

    max-width:none;
    margin:0 0 14px;

  .track{

  }

  .player{

  }

  }

  }

    grid-template-columns:repeat(4,1fr);

@media(max-width:420px){
  .hero h1{font-size:34px}

</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">VC</div><div><strong>V.C Music</strong><small>Player de músicas</small></div></div>
    <nav>
      <button class="nav active" data-page="home">⌂ <span>Início</span></button>
      <button class="nav" data-page="search">⌕ <span>Buscar</span></button>
      <button class="nav" data-page="library">♫ <span>Biblioteca</span></button>
      <button class="nav" data-page="favorites">♥ <span>Favoritos</span></button>
    </nav>
    <div class="playlist-box"><div class="playlist-title">MINHAS PLAYLISTS</div><button id="newPlaylistBtn" class="plain">＋ Criar playlist</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="mobile-brand"><div class="brandmark small">VC</div><strong>V.C Music</strong></div>
      <button id="addMusicBtn" class="pill">＋ Adicionar músicas</button>
      <input id="fileInput" type="file" accept="audio/*" multiple hidden>
    </header>

    <section id="page-home" class="page active">
      <div class="hero">
        <div><span class="eyebrow">SEU PLAYER</span><h1>Suas músicas.<br>Do seu jeito.</h1><p>Ouça músicas do aparelho, organize sua biblioteca e marque favoritos.</p><button id="heroAddBtn" class="cta">Adicionar músicas</button></div>
        <div class="hero-disc"><div class="disc-ring"><div class="disc-core">VC</div></div></div>
      </div>
      <div class="section-head"><h2>Adicionadas recentemente</h2></div>
      <div id="recentGrid" class="grid"></div>
    </section>

    <section id="page-search" class="page">
      <div class="section-head"><h2>Buscar</h2></div>
      <input id="searchInput" class="search" placeholder="O que você quer ouvir?">
      <div id="searchResults" class="track-list"></div>
    </section>

    <section id="page-library" class="page">
      <div class="section-head"><h2>Biblioteca</h2><span id="libraryCount" class="muted"></span></div>
      <div id="libraryList" class="track-list"></div>
    </section>

    <section id="page-favorites" class="page">
      <div class="section-head"><h2>Favoritos</h2></div>
      <div id="favoriteList" class="track-list"></div>
    </section>
  </main>
</div>

<div class="player">
  <div class="now">
    <div class="cover-mini">♫</div>
    <div class="now-text"><strong id="nowTitle">Nenhuma música</strong><span id="nowArtist">Adicione uma música para começar</span></div>
    <button id="favNow" class="icon-btn">♡</button>
  </div>
  <div class="controls">
    <div class="buttons">
      <button id="shuffleBtn" class="icon-btn">⤨</button>
      <button id="prevBtn" class="icon-btn">⏮</button>
      <button id="playBtn" class="play-btn">▶</button>
      <button id="nextBtn" class="icon-btn">⏭</button>
      <button id="repeatBtn" class="icon-btn">↻</button>
    </div>
    <div class="timeline"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div>
  </div>
  <div class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></div>
  <div class="player-visualizer" id="playerVisualizer" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<audio id="audio"></audio>

<div class="mobile-nav">
  <button class="mnav active" data-page="home">⌂<span>Início</span></button>
  <button class="mnav" data-page="search">⌕<span>Buscar</span></button>
  <button class="mnav" data-page="library">♫<span>Biblioteca</span></button>
  <button class="mnav" data-page="favorites">♥<span>Favoritos</span></button>
</div>
<script>

const audio=document.getElementById('audio'),fileInput=document.getElementById('fileInput');
let tracks=[],favorites=new Set(),currentIndex=-1,repeat=false,shuffle=false;
const urls=new Map();
const fmt=s=>!isFinite(s)?'0:00':`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const esc=(s='')=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function page(name){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${name}`));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));renderAll()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));
function row(t,i){const fav=favorites.has(t.id);return `<div class="track"><button class="track-cover play-row" data-i="${i}">♫</button><div class="track-info"><strong>${esc(t.title)}</strong><span>${esc(t.artist)}</span></div><button class="icon-btn fav-row ${fav?'on':''}" data-id="${t.id}">${fav?'♥':'♡'}</button><button class="icon-btn play-row" data-i="${i}">▶</button></div>`}
function wire(root){root.querySelectorAll('.play-row').forEach(b=>b.onclick=()=>playIndex(+b.dataset.i));root.querySelectorAll('.fav-row').forEach(b=>b.onclick=()=>toggleFav(b.dataset.id))}
function renderAll(){
  const recent=document.getElementById('recentGrid');
  recent.innerHTML=tracks.length?tracks.slice(-8).reverse().map(t=>`<div class="card" data-id="${t.id}"><div class="cover">♫</div><strong>${esc(t.title)}</strong><span>${esc(t.artist)}</span></div>`).join(''):'<div class="empty">Adicione suas primeiras músicas.</div>';
  recent.querySelectorAll('.card').forEach(c=>c.onclick=()=>playIndex(tracks.findIndex(t=>t.id===c.dataset.id)));
  const lib=document.getElementById('libraryList');lib.innerHTML=tracks.length?tracks.map(row).join(''):'<div class="empty">Sua biblioteca está vazia.</div>';wire(lib);document.getElementById('libraryCount').textContent=`${tracks.length} música(s)`;
  const favs=tracks.filter(t=>favorites.has(t.id));const fr=document.getElementById('favoriteList');fr.innerHTML=favs.length?favs.map(t=>row(t,tracks.indexOf(t))).join(''):'<div class="empty">Nenhuma música favorita.</div>';wire(fr);
  renderSearch(document.getElementById('searchInput').value);
}
function renderSearch(q=''){const x=q.trim().toLowerCase();const arr=!x?tracks:tracks.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(x));const r=document.getElementById('searchResults');r.innerHTML=arr.length?arr.map(t=>row(t,tracks.indexOf(t))).join(''):'<div class="empty">Nenhum resultado.</div>';wire(r)}
document.getElementById('searchInput').oninput=e=>renderSearch(e.target.value);
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);renderAll();updateNow()}
function playIndex(i){if(i<0||i>=tracks.length)return;currentIndex=i;audio.src=urls.get(tracks[i].id);audio.play();updateNow()}
function updateNow(){const t=tracks[currentIndex];document.getElementById('playBtn').textContent=audio.paused?'▶':'❚❚';const vz=document.getElementById('playerVisualizer');if(vz)vz.classList.toggle('active',!audio.paused);if(!t)return;document.getElementById('nowTitle').textContent=t.title;document.getElementById('nowArtist').textContent=t.artist;
  const mt=document.getElementById('mobileNowTitle'),ma=document.getElementById('mobileNowArtist');
  if(mt)mt.textContent=t.title;
  if(ma)ma.textContent=t.artist;const f=document.getElementById('favNow');const on=favorites.has(t.id);f.textContent=on?'♥':'♡';f.classList.toggle('on',on)}
document.getElementById('playBtn').onclick=()=>{if(currentIndex<0&&tracks.length)return playIndex(0);if(!audio.src)return;audio.paused?audio.play():audio.pause();updateNow()};
document.getElementById('prevBtn').onclick=()=>tracks.length&&playIndex(currentIndex<=0?tracks.length-1:currentIndex-1);
document.getElementById('nextBtn').onclick=()=>next();
function next(){if(!tracks.length)return;shuffle?playIndex(Math.floor(Math.random()*tracks.length)):playIndex((currentIndex+1)%tracks.length)}
document.getElementById('shuffleBtn').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle)};
document.getElementById('repeatBtn').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on',repeat)};
document.getElementById('favNow').onclick=()=>currentIndex>=0&&toggleFav(tracks[currentIndex].id);
audio.onended=()=>repeat?playIndex(currentIndex):next();audio.onplay=updateNow;audio.onpause=updateNow;audio.ontimeupdate=()=>{document.getElementById('currentTime').textContent=fmt(audio.currentTime);document.getElementById('duration').textContent=fmt(audio.duration);document.getElementById('seek').value=audio.duration?audio.currentTime/audio.duration*100:0};
document.getElementById('seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};document.getElementById('volume').oninput=e=>audio.volume=e.target.value;audio.volume=.8;
function addFiles(list){[...list].forEach(file=>{const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString());let name=file.name.replace(/\.[^.]+$/,'');let artist='Arquivo local',title=name;if(name.includes(' - ')){const p=name.split(' - ');artist=p.shift();title=p.join(' - ')}tracks.push({id,title,artist});urls.set(id,URL.createObjectURL(file))});renderAll()}
fileInput.onchange=e=>addFiles(e.target.files);document.getElementById('addMusicBtn').onclick=()=>fileInput.click();document.getElementById('heroAddBtn').onclick=()=>fileInput.click();document.getElementById('newPlaylistBtn').onclick=()=>alert('Playlists personalizadas entram na próxima versão.');
renderAll();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
